name = "nba-oracle-discord"
main = "worker.js"
compatibility_date = "2026-10-01"
workers_dev = true

[vars]
DISCORD_APPLICATION_ID = "1564803252552335420"
DISCORD_PUBLIC_KEY = "828e1ac7c2dd9f6c5af36cca08d2770727666a8475f424024602c9c35ab5cd1d"
GITHUB_REPO = "lucksociety/nba-oracle"
GITHUB_WORKFLOW = "discord-nba.yml"
GITHUB_REF = "main"
SIMS = "300000"
# /nba only runs in these channel ids (comma-separated); = channel of the DISCORD_WEBHOOK_URL webhook
ALLOWED_CHANNEL_ID = "1337821807478177927"
# Daily auto-post 30 min before the first tip (auto.js). Set to "off" + `npx wrangler deploy` to pause.
AUTO_POST = "on"
# Secrets (set with `wrangler secret put`): GITHUB_TOKEN, RELAY_KEY, DISCORD_BOT_TOKEN

# Auto-post: check every 5 min; dispatches discord-nba.yml once per ET date inside the T-30 window.
[triggers]
crons = ["*/5 * * * *"]

# Once-per-date dedupe marker for the auto-post
[[kv_namespaces]]
binding = "AUTO_KV"
id = "470b7ae994c044cfa0bd59b95a587611"
