name: Model and command checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Offline model and Discord routing regressions
        run: |
          node test/data-recovery.test.mjs
          node test/history.test.mjs
          node test/availability-stress.test.mjs
          node test/availability.test.mjs
          node test/freshness.test.mjs
          node test/execution-liquidity.test.mjs
          node test/probability-certainty.test.mjs
          node test/score-consistency.test.mjs
          node test/live-refresh.test.mjs
          node test/input-validation.test.mjs
          node test/endgame.test.mjs
          node test/firewall.test.mjs
          node discord/test-worker.mjs
          node discord/test-auto.mjs
      - name: Prospective evaluation regressions
        run: |
          python3 -m unittest discover -s scripts -p test_model_learning.py
          python3 -m unittest discover -s scripts -p test_bet_learning.py
      - name: Evergreen data and reconciliation regressions
        run: python3 -m unittest discover -s scripts -p test_evergreen.py
